services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi
      POSTGRES_DB: koicloud
    ports:
      - "5432:5432"
    volumes:
      - koicloud_db:/var/lib/postgresql/data

  api:
    build: ./apps/api
    working_dir: /app
    command: sh -lc "uv sync --group dev && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://koi:koi@db:5432/koicloud
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    depends_on:
      - db
    ports:
      - "8000:8000"

  worker:
    build: ./apps/api
    working_dir: /app
    command: sh -lc "uv sync --group dev && uv run python -m app.main"
    env_file:
      - .env.example
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    depends_on:
      - db

  node-agent:
    build: ./apps/node-agent
    working_dir: /app
    command: sh -lc "uv sync --group dev && uv run python -m agent.main"
    env_file:
      - .env.example
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      INTERNAL_API_URL: http://api:8000/internal/v1
    volumes:
      - ./apps/node-agent:/app
    depends_on:
      - api

  # Real postgres pond for the Friday hito when there is no VPS.
  # `make pond-demo` or: docker compose --profile ponds up -d pond-demo
  pond-demo:
    profiles: ["ponds"]
    image: postgres:16-alpine
    container_name: koicloud-inventario-demo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-pond-dev-only
      POSTGRES_DB: inventario_demo
    ports:
      - "15432:5432"
    labels:
      koicloud.managed: "true"
      koicloud.pond: inventario-demo
      koicloud.pond_id: pond-local-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventario_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  koicloud_db:
