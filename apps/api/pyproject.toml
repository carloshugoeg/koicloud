[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koicloud-api"
version = "0.1.0"
description = "Phase 0 API contract freeze for KoiCloud"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "argon2-cffi",
  "asyncpg",
  "cryptography",
  "fastapi",
  "psycopg[binary]",
  "pydantic-settings",
  "pyjwt",
  "slowapi",
  "greenlet",
  "sqlalchemy",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
export-openapi = "app.tooling.export_openapi:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
