[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koicloud-cli"
version = "0.1.0"
description = "Typer CLI scaffold for KoiCloud."
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "pydantic",
  "pydantic-settings",
  "rich",
  "typer",
]

[project.scripts]
koicloud = "koicloud_cli.main:app"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["koicloud_cli"]
