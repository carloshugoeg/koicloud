# Production compose for a provisioned Linux host. No VPS/IP is named here.
# Local check: bash infra/scripts/check-prod-compose.sh
# Host: docker compose --env-file infra/env/prod.env -f infra/docker-compose.prod.yml …

name: koicloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-koicloud}
    volumes:
      - koicloud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://koi:change-me@db:5432/koicloud}
      JWT_SECRET: ${JWT_SECRET:-change-me-32-random-bytes}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      POND_PASSWORD_KEY: ${POND_PASSWORD_KEY:-change-me-fernet-key}
      KOICLOUD_DOMAIN: ${KOICLOUD_DOMAIN:-koicloud.example}
      NODE_PUBLIC_HOST: ${NODE_PUBLIC_HOST:-change-me-public-host}
      NODE_ID: ${NODE_ID:-node-prod}
      NODE_TOKEN: ${NODE_TOKEN:-change-me}
      POND_PORT_RANGE_START: ${POND_PORT_RANGE_START:-15000}
      POND_PORT_RANGE_END: ${POND_PORT_RANGE_END:-15999}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      INVOICE_DIR: ${INVOICE_DIR:-/var/lib/koicloud/invoices}
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/koicloud/backups}
    volumes:
      - invoices:/var/lib/koicloud/invoices
      - backups:/var/lib/koicloud/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    command:
      [
        "sh",
        "-lc",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  worker:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://koi:change-me@db:5432/koicloud}
      JWT_SECRET: ${JWT_SECRET:-change-me-32-random-bytes}
      POND_PASSWORD_KEY: ${POND_PASSWORD_KEY:-change-me-fernet-key}
      NODE_ID: ${NODE_ID:-node-prod}
      NODE_TOKEN: ${NODE_TOKEN:-change-me}
      INVOICE_DIR: ${INVOICE_DIR:-/var/lib/koicloud/invoices}
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/koicloud/backups}
    volumes:
      - invoices:/var/lib/koicloud/invoices
      - backups:/var/lib/koicloud/backups
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "while true; do uv run python -m app.workers.daily_backups; uv run python -m app.workers.daily_usage; sleep 3600; done",
      ]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      KOICLOUD_DOMAIN: ${KOICLOUD_DOMAIN:-koicloud.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/koicloud/web:/srv/koicloud/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  koicloud_db:
  caddy_data:
  caddy_config:
  invoices:
  backups:
