# Production compose for one Linux host (Oracle Always Free ARM Ampere OK).
# Bases are multi-arch (amd64 and arm64): postgres:16-alpine,
# python:3.12-slim (api/worker/node-agent Dockerfiles), caddy:2.8-alpine.
# Do not pin an amd64-only platform. No VPS/IP is named here.
# Local check: bash infra/scripts/check-prod-compose.sh
# Host: docker compose --env-file infra/env/prod.env -f infra/docker-compose.prod.yml …
# Real ponds: node-agent unit sets AGENT_MODE=docker (see docker-compose.docker-agent.yml).
# HTTP-only local proxy overlay: -f infra/docker-compose.http.yml

name: koicloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-koicloud}
    volumes:
      - koicloud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      # Pinned: Settings production guards (email + default secrets) only run here.
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      POND_PASSWORD_KEY: ${POND_PASSWORD_KEY:?set POND_PASSWORD_KEY}
      KOICLOUD_DOMAIN: ${KOICLOUD_DOMAIN:-koicloud.example}
      NODE_PUBLIC_HOST: ${NODE_PUBLIC_HOST:-change-me-public-host}
      NODE_ID: ${NODE_ID:-node-prod}
      NODE_TOKEN: ${NODE_TOKEN:?set NODE_TOKEN}
      POND_PORT_RANGE_START: ${POND_PORT_RANGE_START:-15000}
      POND_PORT_RANGE_END: ${POND_PORT_RANGE_END:-15999}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_DEMO_PASSWORD: ${MCP_DEMO_PASSWORD:?set MCP_DEMO_PASSWORD}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      INVOICE_DIR: ${INVOICE_DIR:-/var/lib/koicloud/invoices}
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/koicloud/backups}
    volumes:
      - invoices:/var/lib/koicloud/invoices
      - backups:/var/lib/koicloud/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    command:
      [
        "sh",
        "-lc",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  worker:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      POND_PASSWORD_KEY: ${POND_PASSWORD_KEY:?set POND_PASSWORD_KEY}
      NODE_ID: ${NODE_ID:-node-prod}
      NODE_TOKEN: ${NODE_TOKEN:?set NODE_TOKEN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      INVOICE_DIR: ${INVOICE_DIR:-/var/lib/koicloud/invoices}
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/koicloud/backups}
    volumes:
      - invoices:/var/lib/koicloud/invoices
      - backups:/var/lib/koicloud/backups
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.workers' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      [
        "sh",
        "-lc",
        "while true; do uv run python -m app.workers.daily_backups; uv run python -m app.workers.daily_usage; uv run python -m app.workers.daily_renewal; sleep 3600; done",
      ]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      KOICLOUD_DOMAIN: ${KOICLOUD_DOMAIN:-koicloud.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/koicloud/web:/srv/koicloud/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  koicloud_db:
  caddy_data:
  caddy_config:
  invoices:
  backups:
