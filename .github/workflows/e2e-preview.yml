name: e2e-preview

on:
  pull_request:

concurrency:
  group: e2e-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Branch-tip Vercel preview for w1-e2e-preview-verify (#142). Never localhost.
      PLAYWRIGHT_BASE_URL: https://koicloud-web-git-w1-e2e-preview-verify-hugos-projects-3379fa36.vercel.app
      KOI_PUBLIC_BASE_URL: https://koicloud-web-git-w1-e2e-preview-verify-hugos-projects-3379fa36.vercel.app
      # Hosted sim on the preview origin — no Playwright page.route for /api or /mcp.
      KOI_HOSTED_SIM: "1"
      KOI_SIM_BASE_URL: https://koicloud-web-git-w1-e2e-preview-verify-hugos-projects-3379fa36.vercel.app
      KOI_ALLOW_PREVIEW_SEED: "1"
      PYTHON_VERSION: "3.12"
      NODE_VERSION: "22"
    steps:
      - uses: actions/checkout@v4

      - name: Wait for SHA-exact preview with hosted sim
        run: |
          set -euo pipefail
          echo "Waiting for preview ${PLAYWRIGHT_BASE_URL} (sha=${GITHUB_SHA})"
          for _ in $(seq 1 60); do
            code=$(curl -sS --connect-timeout 5 --max-time 20 \
              -o /tmp/preview-home.html -w "%{http_code}" "$PLAYWRIGHT_BASE_URL/" || echo "000")
            health_code=$(curl -sS --connect-timeout 5 --max-time 20 \
              -o /tmp/preview-health.json -w "%{http_code}" "$PLAYWRIGHT_BASE_URL/api/v1/health" || echo "000")
            echo "home=${code} health=${health_code}"
            if [ "$code" = "200" ] && [ "$health_code" = "200" ]; then
              if python3 e2e/preview/check_preview_health.py "$GITHUB_SHA" /tmp/preview-health.json; then
                echo "preview HTTP 200 + health JSON for ${GITHUB_SHA}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "preview sim did not become ready" >&2
          head -c 400 /tmp/preview-health.json >&2 || true
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Seed gate users on hosted preview sim
        run: |
          echo "KOI_GATE_CREDENTIALS_OUT=$RUNNER_TEMP/gate-credentials.json" >> "$GITHUB_ENV"
          echo "KOI_E2E_MEDIA_DIR=$RUNNER_TEMP/e2e-verify-media" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-verify-media"
          export KOI_GATE_CREDENTIALS_OUT="$RUNNER_TEMP/gate-credentials.json"
          export KOI_SIM_BASE_URL
          export KOI_ALLOW_PREVIEW_SEED
          bash scripts/seed-gate-preview.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: e2e/preview
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: MCP client suite via preview /mcp (no intercept)
        id: mcp
        working-directory: e2e/preview
        run: npx playwright test tests/mcp.spec.ts
        continue-on-error: true

      - name: Playwright preview suite (no /api intercept)
        id: playwright
        working-directory: e2e/preview
        run: npx playwright test tests/preview.spec.ts
        continue-on-error: true

      - name: Write results table
        if: always()
        run: python3 e2e/preview/write_results.py
        env:
          KOI_E2E_RESULTS_OUT: ${{ runner.temp }}/e2e-verify-results.md
          KOI_GIT_SHA: ${{ github.sha }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-screenshots
          path: |
            e2e/preview/artifacts/*.png
            ${{ runner.temp }}/e2e-verify-results.md
          if-no-files-found: ignore

      - name: Fail when a suite failed
        if: always()
        run: |
          test "${{ steps.mcp.outcome }}" = "success"
          test "${{ steps.playwright.outcome }}" = "success"
