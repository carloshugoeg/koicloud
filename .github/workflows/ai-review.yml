name: ai-review

# Compuerta de revisión automática (ENGINEERING §8.2, ADR-008).
# Nivel 1: el revisor bloquea cualquier PR con veredicto REQUEST_CHANGES.
# Nivel 2: si el veredicto es APPROVE y el PR no toca rutas críticas, la cuenta koi-reviewer-bot aprueba
#          y habilita auto-merge. Las rutas críticas siguen exigiendo la aprobación humana de W1 (CODEOWNERS).
#
# Secretos requeridos: ANTHROPIC_API_KEY, KOI_BOT_TOKEN (PAT de la cuenta koi-reviewer-bot: pull_requests:write, contents:read).
# P0-11 verifica los inputs vigentes de anthropics/claude-code-action@v1 antes de activar este workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # si cambia una etiqueta (cross-workstream, contract-change), reejecutar desde la pestaña Actions

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ai-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      critical: ${{ steps.paths.outputs.critical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect critical paths (mirror of the CODEOWNERS @HUGO entries; keep both in sync)
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          CRITICAL=false
          while read -r f; do
            case "$f" in
              AGENTS.md|CLAUDE.md|GEMINI.md|README.md|LICENSE|Makefile|docker-compose.yml|.env.example|.gitignore|scripts/*|\
              .cursor/*|.agents/*|.github/*|packages/contracts/*|apps/api/alembic/*|apps/api/alembic.ini|apps/api/pyproject.toml|apps/api/uv.lock|\
              apps/api/app/main.py|apps/api/app/api_v1.py|apps/api/app/internal_v1.py|apps/api/app/schemas.py|apps/api/app/core/*|apps/api/app/commands/*|apps/api/app/internal_api/*|apps/api/app/workers/*|apps/api/app/tooling/*|\
              apps/api/app/modules/ponds/*|apps/api/app/modules/jobs/*|apps/api/app/modules/nodes/*|apps/api/app/modules/backups/*|apps/api/app/modules/metering/*|apps/api/app/modules/agent_access/*|\
              apps/node-agent/*|apps/web/package.json|apps/web/pnpm-lock.yaml|apps/cli/pyproject.toml|apps/cli/uv.lock|\
              docs/architecture/*|docs/tickets/*|docs/WORKSTREAMS.md|docs/visual-guidelines.md|docs/visual-guidelines-agent-prompt.md|docs/branch-naming.md|docs/agent-onboarding.md|docs/runbooks/*)
                CRITICAL=true ;;
            esac
          done < changed.txt
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "critical paths touched: $CRITICAL"

      - name: Run reviewer
        id: reviewer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/review-prompt.md to the letter. Read AGENTS.md,
            docs/architecture/api-surface.md, docs/architecture/data-model.md, the PR body and the
            referenced ticket in docs/tickets/, then the full diff.
            Post exactly one review comment on the PR using the mandatory output format, ending with the
            line "KOI-REVIEW: APPROVE" or "KOI-REVIEW: REQUEST_CHANGES".
          claude_args: "--max-turns 40"

      - name: Read verdict from the reviewer comment
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("KOI-REVIEW:"))] | last | .body')
          if echo "$BODY" | grep -q "KOI-REVIEW: APPROVE"; then V=APPROVE
          elif echo "$BODY" | grep -q "KOI-REVIEW: REQUEST_CHANGES"; then V=REQUEST_CHANGES
          else V=MISSING; fi
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
          echo "verdict: $V"
          if [ "$V" != "APPROVE" ]; then
            echo "::error::Automated review verdict: $V"
            exit 1
          fi

  approve:
    name: bot-approve
    needs: review
    if: needs.review.outputs.verdict == 'APPROVE'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Approve as koi-reviewer-bot
        env:
          GH_TOKEN: ${{ secrets.KOI_BOT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          CRITICAL: ${{ needs.review.outputs.critical }}
        run: |
          if [ "$CRITICAL" = "true" ]; then
            gh pr review "$PR" --approve --body "Revisión automática: APPROVE. Este PR toca rutas críticas: requiere además la aprobación humana de W1 (CODEOWNERS)."
          else
            gh pr review "$PR" --approve --body "Revisión automática: APPROVE. Rutas no críticas: auto-merge habilitado; se fusiona cuando CI esté verde."
            gh pr merge "$PR" --auto --squash || echo "auto-merge not enabled on this repo or already set"
          fi
