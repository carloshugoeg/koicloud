[loggers]
keys = root, app

[handlers]
keys = console

[formatters]
keys = plain

[logger_root]
level = INFO
handlers = console

[logger_app]
level = INFO
handlers = console
qualname = app
propagate = 0

[handler_console]
class = StreamHandler
level = INFO
formatter = plain
args = (sys.stderr,)

[formatter_plain]
format = %(levelname)s %(name)s %(message)s
